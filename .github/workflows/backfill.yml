name: Backfill and gap-fill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day to fill, YYYY-MM-DD (leave empty to only heal the last 3 days)"
        required: false
        default: ""
  schedule:
    - cron: "37 3 * * *"   # once a day: heal the last 3 days

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backfill
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then
            python -m agentweather.backfill --start "${{ github.event.inputs.start }}"
          else
            python -m agentweather.backfill --days 3
          fi
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
