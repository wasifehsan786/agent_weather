name: Training

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"   # once a day, 06:23 Islamabad time

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ml.txt
      - name: Train, evaluate, register if better
        run: python -m agentweather.train
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      - name: Save the results
        uses: actions/upload-artifact@v4
        with:
          name: train-report
          path: train_output/
          retention-days: 30
